name: Build Denali Images

on:
  push:
    branches:
      - main
    paths:
      - '*.*-*/*'
      - '.github/workflows/build-denali.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os_version: [bookworm]
        type: [base, packages]
        python_version: [3.11, 3.12]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Docker login
      env:
        DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo $DOCKER_HUB_PASSWORD | docker login --username $DOCKER_HUB_USERNAME --password-stdin
        echo $GITHUB_TOKEN | docker login ghcr.io --username $GITHUB_ACTOR --password-stdin

    - name: Set Environment Variables
      id: vars
      run: |
        DOCKFILE_DIR=${{ matrix.python_version }}-${{ matrix.os_version }}/${{ matrix.type }}
        if [[ -f ${DOCKFILE_DIR}/Dockerfile ]]; then
          VERSION=${{ matrix.python_version }}-${{ matrix.os_version }}-${{ matrix.type }}
          echo "${VERSION}" > ${DOCKFILE_DIR}/version.txt
        else
          VERSION=$(cat ${DOCKFILE_DIR}/version.txt)
        fi
        echo "DOCKFILE_DIR=${DOCKFILE_DIR}" >> $GITHUB_ENV
        echo "VERSION=${VERSION}" >> $GITHUB_ENV

    - name: Build Docker Image
      run: |
        IMAGE_NAME=ringcentral/denali-${{ matrix.type }}
        echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
        docker build --tag ${IMAGE_NAME} --file ${DOCKFILE_DIR}/Dockerfile .

    - name: Tag and Push Docker Images
      run: |
        IMAGE_NAME=ringcentral/denali-${{ matrix.type }}
        GH_DOCKER_PKG_IMAGE_NAME=ghcr.io/ringcentral-docker/denali/denali-${{ matrix.type }}

        docker tag "${IMAGE_NAME}" "${IMAGE_NAME}:${VERSION}"
        docker push "${IMAGE_NAME}:${VERSION}"

        docker tag "${IMAGE_NAME}" "${GH_DOCKER_PKG_IMAGE_NAME}:${VERSION}"
        docker push "${GH_DOCKER_PKG_IMAGE_NAME}:${VERSION}"

        if [[ "${{ matrix.python_version }}" == "3.11" && "${{ matrix.os_version }}" == "bookworm" ]]; then
          docker tag "${IMAGE_NAME}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"
          docker tag "${IMAGE_NAME}" "${GH_DOCKER_PKG_IMAGE_NAME}:latest"
          docker push "${GH_DOCKER_PKG_IMAGE_NAME}:latest"
        fi

    - name: Generate README Update
      run: |
        IMAGE_NAME=ringcentral/denali-${{ matrix.type }}
        GH_DOCKER_PKG_IMAGE_NAME=ghcr.io/ringcentral-docker/denali/denali-${{ matrix.type }}

        NEW_ENTRY="| Python ${{ matrix.python_version }} | ${{ matrix.os_version }} | ${{ matrix.type }} | ${VERSION} | \`${IMAGE_NAME}:${VERSION}\` | \`${GH_DOCKER_PKG_IMAGE_NAME}:${VERSION}\` |"
        echo "${NEW_ENTRY}" > readme_updates_${VERSION}.txt

    - name: Upload README Update
      uses: actions/upload-artifact@v4
      with:
        name: readme-updates-${{ matrix.python_version }}-${{ matrix.os_version }}-${{ matrix.type }}
        path: readme_updates_${VERSION}.txt

  update-readme:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download ALL README Updates
      uses: actions/download-artifact@v4
      with:
        path: ./readme-updates

    - name: Initialize README
      run: |
        echo "| Python Version | OS Version | Type | Version | Docker Hub | GitHub Package |" > README.md
        echo "|----------------|------------|------|---------|------------|----------------|" >> README.md

    - name: Update README
      run: |
        if [ -z "$(find ./readme-updates -type f -name '*.txt')" ]; then
          echo "No updates found. Skipping README update."
          exit 0
        fi
        for file in ./readme-updates/*/*; do
          cat "$file" >> README.md
        done

    - name: Commit README Update
      run: |
        git config --global user.name 'john.lin'
        git config --global user.email 'john.lin@ringcentral.com'
        git add README.md
        git commit -m "Update README with Docker image info"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}